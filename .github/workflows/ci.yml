# .github/workflows/ci.yml
#
# DELIBERATE DEVIATION from templates/app-template's ci.yml, not a copy
# of it: that template is Node/npm-specific (this app is Python/FastAPI),
# builds/smoke-tests a Dockerfile (this app deploys via nixpacks, see
# README's "Build: nixpacks, not a Dockerfile" -- no Dockerfile exists in
# this repo at all, so a container-build gate would test something
# different from what actually gets deployed), and its staging/production
# promotion steps trigger Coolify via GitHub Actions webhook secrets --
# that's not how deploys actually happen on this platform; zorc's own
# deploy/agent.py calls the Coolify API directly, no GitHub Actions
# involved at any point. Kept here: gates 1-2 (static, unit) in the same
# spirit, adapted for this app's real stack. No container/staging/
# production gates -- there's nothing meaningful for this workflow to
# build or promote that matches the real deploy path.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:

  # ---------------------------------------------------------------- gate 1
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate app.yaml exists and parses
        run: |
          test -f app.yaml || { echo "app.yaml missing — see AGENTS.md §5"; exit 1; }
          python3 -c "import yaml,sys; d=yaml.safe_load(open('app.yaml')); \
            [sys.exit(f'app.yaml missing {k}') for k in \
             ('name','runtime','domains','health') if k not in d]"

      - name: Validate Procfile exists (nixpacks needs it to start this app)
        run: test -f Procfile || { echo "Procfile missing — nixpacks won't know how to start this app"; exit 1; }

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check main.py tests/

  # ---------------------------------------------------------------- gate 2
  unit:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/ -v

# No container/staging/production gates -- see this file's header comment.
