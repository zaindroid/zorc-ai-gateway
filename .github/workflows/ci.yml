# .github/workflows/ci.yml
#
# DELIBERATE DEVIATION from templates/app-template's ci.yml, not a copy
# of it: that template is Node/npm-specific (this app is Python/FastAPI)
# and its staging/production promotion steps trigger Coolify via GitHub
# Actions webhook secrets (COOLIFY_STAGING_WEBHOOK etc.) -- that's not how
# deploys actually happen on this platform; zorc's own deploy/agent.py
# calls the Coolify API directly, no GitHub Actions involved at any point.
# Kept here: the same 4 static/unit/integration/container gates in
# spirit, adapted for this app's real stack and real deploy mechanism.
# Gate 3 (integration) is a no-op here -- this app has no database/queue
# to integration-test against, it's a stateless proxy.

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:

  # ---------------------------------------------------------------- gate 1
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate app.yaml exists and parses
        run: |
          test -f app.yaml || { echo "app.yaml missing — see AGENTS.md §5"; exit 1; }
          python3 -c "import yaml,sys; d=yaml.safe_load(open('app.yaml')); \
            [sys.exit(f'app.yaml missing {k}') for k in \
             ('name','runtime','domains','health') if k not in d]"

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check main.py tests/

  # ---------------------------------------------------------------- gate 2
  unit:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/ -v

  # ---------------------------------------------------------------- gate 4
  container:
    needs: unit
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          push: ${{ github.ref == 'refs/heads/main' }}
          load:  ${{ github.ref != 'refs/heads/main' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}

      - name: Smoke test the built image
        run: |
          docker run -d --name smoke -p 8080:8080 ${{ env.IMAGE }}:${{ github.sha }}

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = 1 ] || { echo "health check never passed"; docker logs smoke; exit 1; }

          echo "--- version endpoint"
          curl -fsS http://localhost:8080/version | tee /tmp/v.json
          grep -q "${GITHUB_SHA:0:7}" /tmp/v.json || { echo "SHA mismatch"; exit 1; }

          echo "--- must not run as root"
          [ "$(docker exec smoke id -u)" != "0" ] || { echo "container runs as root"; exit 1; }

          echo "--- image size"
          size=$(docker image inspect ${{ env.IMAGE }}:${{ github.sha }} --format '{{.Size}}')
          [ "$size" -lt 524288000 ] || { echo "image over 500MB: $size"; exit 1; }

          docker rm -f smoke

# No staging/production promotion jobs -- deploys on this platform go
# through zorc's own deploy()/redeploy() MCP tools (deploy/agent.py),
# triggered by a human or agent explicitly, not by this workflow.
