name: ai-gateway
description: Internal OpenAI-compatible proxy to free-tier AI providers (Groq, Together AI, Google AI Studio, xAI Grok) -- holds real provider keys so no other app on the platform needs to see or handle one directly.
owner: zainey

runtime:
  port: 8080
  memory_mb: 256
  replicas: 1

domains:
  # Deliberately no public domain -- this app is internal-network-only by
  # design (it holds real third-party API keys). Its public DNS/tunnel
  # route created by the normal deploy() flow is removed immediately
  # after the first deploy; see README.
  staging: ai-gateway-staging.zaindroid.me
  production: ai-gateway.zaindroid.me

dependencies:
  postgres: false
  redis: false
  storage: false
  internal: []

provides:
  - id: ai-gateway
    operations: ["POST /{provider}/v1/chat/completions", "GET /providers"]

health:
  path: /health

# Deliberately no env: section for the provider keys (GROQ_API_KEY,
# TOGETHER_API_KEY, GOOGLE_AI_STUDIO_API_KEY, XAI_API_KEY) -- app.yaml's env schema
# only supports "generate: hex" (server-generated) or "required: true"
# (caller must supply at deploy time, blocking deploy without it). None
# of those fit "ship now, wire real keys in as a deliberate follow-up
# once obtained" -- so these are plain runtime env vars the app reads
# with os.environ.get() and treats as optional (a missing one means that
# provider returns 503, not that the app fails to start). See README for
# how they get set once ready.
